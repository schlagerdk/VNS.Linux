<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="csrf" content="{{ csrf }}">
<meta name="admin-site" content="{{ admin_site }}">
<title>{{ hostname }} · Server admin</title>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="page-header">
  <div class="brand">
    <h1>Server admin</h1>
    <span class="host">{{ hostname }}</span>
  </div>
  <nav>
    <button data-view="sites" class="active">Sites</button>
    <button data-view="files">Files</button>
    <button data-view="terminals">Terminals <span id="term-count" class="count"></span></button>
  </nav>
  <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit" class="ghost">Log out</button></form>
</header>
<main>
  <section id="view-sites">
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search sites…  ( / )" autocomplete="off">
      <span class="spacer"></span>
      <button id="btn-new-site" class="primary">＋ New site</button>
      <button id="btn-server-shell">Server shell</button>
      <button id="btn-refresh" title="Refresh">⟳</button>
    </div>
    <div id="sites" class="cards"></div>
    <p id="no-sites" class="empty" hidden>No sites match.</p>
  </section>

  <section id="view-files" hidden>
    <div class="toolbar">
      <div id="crumbs" class="crumbs"></div>
      <span class="spacer"></span>
      <button id="btn-new-file">New file</button>
      <button id="btn-new-folder">New folder</button>
      <button id="btn-upload">Upload</button>
      <input type="file" id="upload-input" multiple hidden>
    </div>
    <div class="split">
      <div class="panel list" id="drop">
        <table id="files"><thead><tr><th>Name</th><th class="num">Size</th><th>Modified</th><th></th></tr></thead><tbody></tbody></table>
        <div class="drop-hint">Drop files here to upload</div>
      </div>
      <div id="editor" class="panel" hidden>
        <div class="toolbar">
          <strong id="editor-path"></strong><span id="editor-dirty" class="dirty" hidden>● unsaved</span>
          <span class="spacer"></span>
          <span id="editor-status" class="muted"></span>
          <button id="editor-save" class="primary">Save (Ctrl+S)</button>
          <button id="editor-close">Close</button>
        </div>
        <textarea id="editor-text" spellcheck="false"></textarea>
      </div>
    </div>
  </section>

  <section id="view-terminals" hidden>
    <div id="tabs"></div>
    <div id="panes"></div>
    <p id="no-terminals" class="empty">No terminals open. Open a shell or run a script from the Sites view.</p>
  </section>
</main>

<div id="toasts"></div>

<dialog id="dlg-prompt">
  <form method="dialog" id="form-prompt">
    <h2 id="prompt-title"></h2>
    <p id="prompt-message"></p>
    <input id="prompt-input" autocomplete="off" spellcheck="false">
    <menu><button type="button" id="prompt-cancel">Cancel</button><button type="submit" id="prompt-ok" class="primary">OK</button></menu>
  </form>
</dialog>

<dialog id="dlg-site">
  <form method="dialog" id="form-site">
    <h2>New site</h2>
    <label>Folder name <input name="site" required placeholder="www.example.com"></label>
    <label>Binding (domain) <input name="binding" required placeholder="www.example.com"></label>
    <label>Type
      <select name="type"><option value="html">HTML</option><option value="python">Python</option><option value="csharp" selected>C# / .NET</option></select>
    </label>
    <fieldset id="csharp-options">
      <legend>C# options</legend>
      <label>Kind <select name="csharp"><option>umbraco</option><option>empty</option></select></label>
      <label>Umbraco version <input name="version" placeholder="default"></label>
      <label>C# project name <input name="project" placeholder="folder name"></label>
      <label>Local publish folder <input name="publish" value="_publish"></label>
      <label>Build <select name="build"><option>Debug</option><option>Release</option></select></label>
    </fieldset>
    <p class="hint">The script runs in a terminal, so you can answer any extra prompt there.</p>
    <menu><button type="button" id="site-cancel">Cancel</button><button type="submit" value="ok" class="primary">Create</button></menu>
  </form>
</dialog>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/xterm-addon-fit.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
